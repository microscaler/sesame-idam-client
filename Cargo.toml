[package]
name = "sesame-idam-client"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Typed Rust client and validated-claims adapter for Sesame-IDAM"
license = "Apache-2.0"
repository = "https://github.com/microscaler/sesame-idam-client"
readme = "README.md"
publish = false

[dependencies]
# Pinned git dep (CI truth): a path dep breaks every consumer that pulls this
# crate from git. Local co-development redirects via the ancestor cargo config
# (~/Workspace/remote/microscaler/.cargo/config.toml [patch]), never here.
# rev = BRRTRouter main, the rev the consumers pin (one brrtrouter in their graphs).
brrtrouter = { git = "https://github.com/microscaler/BRRTRouter.git", rev = "1a2157102b966ec48348e8b80ae4ccbb33f24b5c", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
urlencoding = "2.1"
uuid = { version = "1.0", features = ["serde"] }
# bff module (ADR-014): PKCE, opaque session ids, Basic client auth,
# coroutine-friendly waits, and the optional Redis session store.
base64 = "0.22"
getrandom = "0.2"
may = "0.3"
# The session-store timings also land in op_duration_seconds{component="sesame.bff_store",op} (microscaler-timing), the
# family the generic operation-latency dashboard reads. Zero dependencies; branch main in every crate of a binary.
microscaler-timing = { git = "https://github.com/microscaler/microscaler-observability.git", branch = "main" }
sha2 = "0.11"
redis = { version = "0.25", default-features = false, optional = true }

[features]
default = []
redis-store = ["dep:redis"]

[dev-dependencies]
serde_yaml = "0.9"
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[lints.rust]
unsafe_code = "forbid"

# Builds and tests here on the may fork the consumers use (their [patch.crates-io] governs them).
[patch.crates-io]
may = { git = "https://github.com/microscaler/may.git", rev = "2156e046291dfd568797f10630ffbc74694d33aa" }
