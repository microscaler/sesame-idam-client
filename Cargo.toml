[package]
name = "sesame-idam-client"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Typed Rust client and validated-claims adapter for Sesame-IDAM"
license = "Apache-2.0"
repository = "https://github.com/microscaler/sesame-idam-client"
readme = "README.md"
publish = false

[dependencies]
brrtrouter = { path = "../BRRTRouter", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
urlencoding = "2.1"
uuid = { version = "1.0", features = ["serde"] }

[dev-dependencies]
serde_yaml = "0.9"

[lints.rust]
unsafe_code = "forbid"
